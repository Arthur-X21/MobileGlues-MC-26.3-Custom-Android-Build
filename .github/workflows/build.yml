
name: Build MobileGlues MC 26.3 (Android ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build libmobileglues.so
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build patched MobileGlues
        run: |
          export NDK="$ANDROID_HOME/ndk/27.0.12077973"
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Android ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-MC26.3-ARM64
          path: build-arm64-v8a/libmobileglues.so
          if-no-files-found: error
          retention-days: 14
